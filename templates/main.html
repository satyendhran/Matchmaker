<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | Competitive Engine</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            900: '#050505',
                            800: '#0a0a0a',
                            700: '#121212',
                        },
                        accent: {
                            400: '#818cf8',
                            500: '#6366f1',
                            glow: 'rgba(99, 102, 241, 0.15)'
                        },
                        glass: {
                            surface: 'rgba(255, 255, 255, 0.03)',
                            border: 'rgba(255, 255, 255, 0.08)',
                            highlight: 'rgba(255, 255, 255, 0.1)',
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #e5e5e5;
            overflow-x: hidden;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
            pointer-events: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .glass-panel {
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .glass-panel.interactive:hover {
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        .btn-neon {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-neon::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn-neon:hover::after { left: 100%; }
        .btn-neon:hover { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); transform: translateY(-1px); }

        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a1a1aa;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .input-dark {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.2s;
        }

        .input-dark:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 1px #6366f1;
            background: rgba(0, 0, 0, 0.5);
        }

        .nav-link {
            position: relative;
            color: #71717a;
            transition: color 0.3s ease;
        }

        .nav-link:hover, .nav-link.active { color: white; }

        .nav-link.active::before {
            content: '';
            position: absolute;
            left: -1.5rem;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 24px;
            background: #6366f1;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px #6366f1;
        }

        .loader-orbit {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(99, 102, 241, 0.1);
            border-top: 2px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .view-transition { opacity: 0; transform: translateY(20px); }
    </style>
</head>

<body class="font-sans text-sm antialiased selection:bg-accent-500 selection:text-white">

    <div class="noise-overlay"></div>
    <div class="ambient-glow"></div>

    <div class="flex h-screen overflow-hidden relative z-10">

        <aside class="w-20 lg:w-64 flex flex-col border-r border-glass-border bg-dark-900/50 backdrop-blur-md z-20 transition-all duration-300">
            <div class="h-20 flex items-center justify-center lg:justify-start lg:px-8 border-b border-glass-border">
                <div class="w-10 h-10 bg-gradient-to-br from-accent-500 to-purple-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-accent-500/20">
                    <i class="ph-bold ph-hexagon text-xl"></i>
                </div>
                <span class="hidden lg:block ml-3 font-display font-bold text-xl tracking-wide text-white">NEXUS</span>
            </div>

            <nav class="flex-1 py-8 flex flex-col gap-2 px-4">
                <div onclick="Router.navigate('dashboard')" id="nav-dashboard"
                    class="nav-link flex items-center gap-4 px-4 py-3 rounded-lg cursor-pointer group">
                    <i class="ph-bold ph-squares-four text-xl group-hover:text-white transition-colors"></i>
                    <span class="hidden lg:block font-medium">Overview</span>
                </div>
                <div onclick="Router.navigate('players')" id="nav-players"
                    class="nav-link flex items-center gap-4 px-4 py-3 rounded-lg cursor-pointer group">
                    <i class="ph-bold ph-users text-xl group-hover:text-white transition-colors"></i>
                    <span class="hidden lg:block font-medium">Directory</span>
                </div>
                <div onclick="Router.navigate('tournaments')" id="nav-tournaments"
                    class="nav-link flex items-center gap-4 px-4 py-3 rounded-lg cursor-pointer group">
                    <i class="ph-bold ph-trophy text-xl group-hover:text-white transition-colors"></i>
                    <span class="hidden lg:block font-medium">Tournaments</span>
                </div>

                <div class="mt-8 mb-2 px-4 hidden lg:block" id="nav-system-label">
                    <p class="text-xs font-bold text-gray-600 uppercase tracking-widest">System</p>
                </div>
                <div id="nav-reload-plugins" onclick="Handlers.reloadPlugins()"
                    class="nav-link flex items-center gap-4 px-4 py-3 rounded-lg cursor-pointer group">
                    <i class="ph-bold ph-plug text-xl group-hover:text-white transition-colors"></i>
                    <span class="hidden lg:block font-medium">Reload Plugins</span>
                </div>
            </nav>

            <div class="p-4 border-t border-glass-border">
                <div class="glass-panel rounded-xl p-3 flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-r from-gray-700 to-gray-600 border border-gray-500 flex items-center justify-center">
                        <i class="ph-bold ph-user text-white text-xs"></i>
                    </div>
                    <div class="hidden lg:block overflow-hidden flex-1">
                        <p id="sidebar-username" class="text-xs font-bold text-white">Admin</p>
                        <p id="sidebar-role" class="text-[10px] text-accent-400">System Online</p>
                    </div>
                    <button onclick="Handlers.logout()" title="Logout"
                        class="hidden lg:flex w-7 h-7 rounded-lg border border-white/10 items-center justify-center text-gray-500 hover:text-red-400 hover:border-red-500/30 transition-all">
                        <i class="ph-bold ph-sign-out text-xs"></i>
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative bg-dark-900">
            <header class="h-20 border-b border-glass-border flex items-center justify-between px-8 bg-dark-900/80 backdrop-blur-sm sticky top-0 z-10">
                <div>
                    <h1 id="page-title" class="font-display font-bold text-2xl text-white tracking-tight">Dashboard</h1>
                    <p id="page-subtitle" class="text-xs text-gray-500 font-mono mt-0.5">NEXUS TOURNAMENT ENGINE V1.0</p>
                </div>

                <div class="flex items-center gap-6">
                    <div id="global-loader" class="hidden opacity-0 transition-opacity duration-300">
                        <div class="w-5 h-5 border-2 border-accent-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>

                    <div class="flex items-center gap-3">
                        <button class="w-10 h-10 rounded-full border border-glass-border flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/5 transition-all">
                            <i class="ph-bold ph-bell"></i>
                        </button>
                        <button onclick="Modals.showSettings()"
                            class="w-10 h-10 rounded-full border border-glass-border flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/5 transition-all">
                            <i class="ph-bold ph-gear"></i>
                        </button>
                    </div>
                </div>
            </header>

            <div id="view-container" class="flex-1 overflow-y-auto p-6 lg:p-10 scroll-smooth">
            </div>
        </main>
    </div>

    <div id="modal-overlay"
        class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center opacity-0 transition-opacity duration-300">
        <div id="modal-content"
            class="glass-panel w-full max-w-lg rounded-2xl p-0 transform scale-95 opacity-0 transition-all duration-300 overflow-hidden shadow-2xl shadow-accent-500/10 border-gray-700">
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-8 right-8 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // ─── API LAYER ───────────────────────────────────────────────────────────────
        const API = {
            baseUrl: '',
            async req(endpoint, method = 'GET', body = null) {
                Loader.start();
                try {
                    const opts = { method, headers: { 'Content-Type': 'application/json' }, credentials: 'include' };
                    if (body) opts.body = JSON.stringify(body);
                    const res = await fetch(endpoint, opts);
                    let data;
                    const responseText = await res.text();
                    try { data = JSON.parse(responseText); }
                    catch (_) { data = { error: responseText ? `Server error (${res.status})` : `Error ${res.status}` }; }
                    if (!res.ok) {
                        if (res.status === 401) { window.location.href = '/login'; return; }
                        const err = new Error(data.error || `Error ${res.status}`);
                        if (data.code) err.code = data.code;
                        throw err;
                    }
                    return data;
                } catch (e) {
                    if (!(e instanceof TypeError && e.message === 'Failed to fetch')) Toast.show(e.message, 'error');
                    throw e;
                } finally { Loader.stop(); }
            },
            getPlayers:        ()          => API.req('/api/players'),
            createPlayer:      (payload)   => API.req('/api/players', 'POST', typeof payload === 'string' ? { name: payload } : payload),
            deletePlayer:      (id)        => API.req(`/api/players/${id}`, 'DELETE'),
            getTournaments:    ()          => API.req('/api/tournaments'),
            createTournament:  (name)      => API.req('/api/tournaments', 'POST', { name }),
            getTournament:     (id)        => API.req(`/api/tournaments/${id}`),
            addPlayers:        (id, pIds)  => API.req(`/api/tournaments/${id}/players`, 'POST', { player_ids: pIds }),
            getRounds:         (id)        => API.req(`/api/tournaments/${id}/rounds`),
            createRound:       (id, s, ppm, force = false) => API.req(`/api/tournaments/${id}/rounds`, 'POST', { round_type: s, players_per_match: ppm, force }),
            getMatches:        (rid)       => API.req(`/api/rounds/${rid}/matches`),
            recordResult:      (mid, data) => API.req(`/api/matches/${mid}/result`, 'POST', data),
            getStandings:      (id)        => API.req(`/api/tournaments/${id}/standings`),
            getStrategies:     ()          => API.req('/api/strategies'),
            getCalculators:    ()          => API.req('/api/calculators'),
            setCalculator:     (id, calc)  => API.req(`/api/tournaments/${id}/calculator`, 'POST', { calculator: calc }),
            reloadPlugins:     ()          => API.req('/api/plugins/reload', 'POST'),
            exportTournament:  (id)        => { window.location.href = `/api/tournaments/${id}/export`; },
            // FIDE
            fideGetTournaments:  ()           => API.req('/api/fide/tournaments'),
            fideCreateTournament:(d)          => API.req('/api/fide/tournaments', 'POST', d),
            fideGetTournament:   (id)         => API.req(`/api/fide/tournaments/${id}`),
            fideGetPlayers:      (id)         => API.req(`/api/fide/tournaments/${id}/players`),
            fideRegisterPlayer:  (id, d)      => API.req(`/api/fide/tournaments/${id}/players`, 'POST', d),
            fideRemovePlayer:    (id, pid)    => API.req(`/api/fide/tournaments/${id}/players/${pid}`, 'DELETE'),
            fideStartingRank:    (id)         => API.req(`/api/fide/tournaments/${id}/starting-rank`),
            fideCreateRound:     (id, force = false) => API.req(`/api/fide/tournaments/${id}/rounds`, 'POST', { force }),
            fideGetPairings:     (id, n)      => API.req(`/api/fide/tournaments/${id}/rounds/${n}/pairings`),
            fideGetStandings:    (id, cat)    => API.req(`/api/fide/tournaments/${id}/standings${cat ? '?category=' + cat : ''}`),
            fideGetCrosstable:   (id)         => API.req(`/api/fide/tournaments/${id}/crosstable`),
            fideGetPlayerCard:   (id, pid)    => API.req(`/api/fide/tournaments/${id}/player-card/${pid}`),
            fideGetTitleNorms:   (id)         => API.req(`/api/fide/tournaments/${id}/title-norms`),
            fideGetColors:       (id)         => API.req(`/api/fide/tournaments/${id}/colors`),
            fideRecordResult:    (mid, r)     => API.req(`/api/fide/matches/${mid}/result`, 'POST', { result: r }),
            fideExport:          (id, r)      => { window.location.href = `/api/fide/tournaments/${id}/export?round=${r || 'all'}`; },
            // Auth
            logout:         ()     => API.req('/api/auth/logout', 'POST'),
            changePassword: (data) => API.req('/api/auth/admin/change-password', 'POST', data),
        };

        // ─── STATE ───────────────────────────────────────────────────────────────────
        const State = {
            activeTournament:    null,
            strategies:          [],
            calculators:         [],
            currentCalculator:   'standard',
            activeFideTournament:null,
            fideTab:             'pairings',
            fideCategoryFilter:  null,
            selectedRound:       'all',
            selectedFideRound:   'all',
            currentUser:         null,
        };

        // ─── HELPERS ─────────────────────────────────────────────────────────────────
        const isPlayerRole = () => State.currentUser && State.currentUser.role === 'player';

        // ─── ROUTER ──────────────────────────────────────────────────────────────────
        const Router = {
            async navigate(view, params = null) {
                if (isPlayerRole() && (view === 'dashboard' || view === 'players')) view = 'player_dashboard';

                document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
                const nav = document.getElementById(`nav-${view}`);
                if (nav) nav.classList.add('active');

                const container = document.getElementById('view-container');
                gsap.to(container, {
                    opacity: 0, y: -10, duration: 0.2, onComplete: async () => {
                        container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-gray-500 gap-4"><div class="loader-orbit"></div><p class="font-mono text-xs tracking-widest uppercase">Loading Data Stream...</p></div>`;
                        gsap.to(container, { opacity: 1, y: 0, duration: 0.2 });
                        try {
                            let html = '';
                            switch (view) {
                                case 'dashboard':         html = await Views.AdminDashboard(); break;
                                case 'players':           html = await Views.Players(); break;
                                case 'tournaments':       html = await Views.Tournaments(); break;
                                case 'tournament_detail': html = await Views.TournamentDetail(params); break;
                                case 'fide_detail':       html = await Views.FideDetail(params); break;
                                case 'admin_dashboard':   html = await Views.AdminDashboard(); break;
                                case 'player_dashboard':  html = await Views.PlayerPage(); break;
                            }
                            container.innerHTML = html;
                            gsap.fromTo('.animate-enter', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.05, ease: 'power2.out' });
                        } catch (e) {
                            console.error(e);
                            container.innerHTML = Components.ErrorState(e.message);
                        }
                    }
                });
            }
        };

        // ─── VIEWS ───────────────────────────────────────────────────────────────────
        const Views = {

            async PlayerPage() {
                const [tournaments, user] = await Promise.all([API.getTournaments(), API.req('/api/auth/me')]);
                document.getElementById('page-title').innerText = 'Player Hub';
                document.getElementById('page-subtitle').innerText = `WELCOME, ${user.name.toUpperCase()}`;
                return `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8 animate-enter">
                        <div class="lg:col-span-2 glass-panel rounded-2xl p-8 relative overflow-hidden flex flex-col justify-center">
                            <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl -mr-16 -mt-16"></div>
                            <div class="relative z-10 flex items-center gap-6">
                                <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-gray-800 to-black border border-gray-700 flex items-center justify-center font-display font-bold text-3xl text-gray-400">
                                    ${user.name.substring(0, 2).toUpperCase()}
                                </div>
                                <div>
                                    <h2 class="font-display font-bold text-3xl text-white mb-1">${user.name}</h2>
                                    <p class="text-gray-400 font-mono text-xs">PLAYER ID: ${user.player_id}</p>
                                    <p class="text-gray-500 font-mono text-xs mt-1">DOB: ${user.date_of_birth}</p>
                                </div>
                            </div>
                        </div>
                        <div class="glass-panel rounded-2xl p-6 flex flex-col justify-center items-center text-center">
                            <span class="text-4xl font-display font-bold text-white mb-1">${tournaments.length}</span>
                            <span class="text-xs font-mono text-gray-500 uppercase tracking-widest">Active Tournaments</span>
                        </div>
                    </div>
                    <div class="animate-enter">
                        <h3 class="font-display font-bold text-xl text-white mb-4 px-2">My Tournaments</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${tournaments.length ? tournaments.map(t => Components.TournamentCard(t)).join('') : Components.EmptyState('You are not registered in any tournaments yet.')}
                        </div>
                    </div>`;
            },

            async AdminDashboard() {
                const [players, tournaments] = await Promise.all([API.getPlayers(), API.getTournaments()]);
                const recentTourneys = tournaments.slice(0, 3);
                document.getElementById('page-title').innerText = 'Admin Dashboard';
                document.getElementById('page-subtitle').innerText = `SYSTEM STATUS: OPTIMAL • ${new Date().toLocaleDateString()}`;
                return `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                        <div class="lg:col-span-2 glass-panel rounded-2xl p-8 relative overflow-hidden animate-enter group">
                            <div class="absolute top-0 right-0 w-64 h-64 bg-accent-500/20 rounded-full blur-3xl -mr-16 -mt-16 group-hover:bg-accent-500/30 transition-all duration-700"></div>
                            <h2 class="font-display font-bold text-3xl text-white mb-2 relative z-10">Welcome back, Admin.</h2>
                            <p class="text-gray-400 max-w-md relative z-10 mb-6">The Nexus engine is ready. You have ${tournaments.length} active tournaments and ${players.length} registered players.</p>
                            <div class="flex gap-4 relative z-10">
                                <button onclick="Modals.createTournament()" class="btn-neon px-6 py-2.5 rounded-lg font-medium text-sm flex items-center gap-2">
                                    <i class="ph-bold ph-plus"></i> Create Tournament
                                </button>
                                <button onclick="Router.navigate('players')" class="btn-ghost px-6 py-2.5 rounded-lg font-medium text-sm">Manage Players</button>
                            </div>
                        </div>
                        <div class="glass-panel rounded-2xl p-6 flex flex-col justify-center items-center text-center animate-enter hover:border-accent-500/50 transition-colors">
                            <div class="w-16 h-16 rounded-full bg-surface-500/10 border border-white/10 flex items-center justify-center mb-4 text-accent-400">
                                <i class="ph-duotone ph-users text-3xl"></i>
                            </div>
                            <span class="text-4xl font-display font-bold text-white mb-1">${players.length}</span>
                            <span class="text-xs font-mono text-gray-500 uppercase tracking-widest">Total Players</span>
                        </div>
                    </div>
                    <div class="animate-enter">
                        <div class="flex justify-between items-end mb-4 px-2">
                            <h3 class="font-display font-bold text-xl text-white">Recent Tournaments</h3>
                            <button onclick="Router.navigate('tournaments')" class="text-xs font-medium text-accent-400 hover:text-white transition-colors">View All</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${recentTourneys.length ? recentTourneys.map(t => Components.TournamentCard(t)).join('') : Components.EmptyState('No tournaments yet')}
                        </div>
                    </div>`;
            },

            async Players() {
                const players = await API.getPlayers();
                document.getElementById('page-title').innerText = 'Player Directory';
                return `
                    <div class="flex flex-col h-full animate-enter">
                        <div class="flex justify-between items-center mb-6">
                            <div class="relative w-full max-w-sm">
                                <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                                <input type="text" placeholder="Search players..." class="input-dark w-full pl-10 pr-4 py-2.5 rounded-lg text-sm" onkeyup="Handlers.searchPlayers(this.value)">
                            </div>
                            <button onclick="Modals.addPlayer()" class="btn-neon px-5 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2">

        // ─── FIDE TAB VIEWS ──────────────────────────────────────────────────────────

            async renderTab(tid, tab, players, tournament) {
                switch (tab) {

                    case 'pairings':   return await this.PairingsTab(tid, tournament);
                    case 'standings':  return await this.StandingsTab(tid, tournament);

            PlayersTab(tid, players, tournament) {
                const isPlayer = isPlayerRole();   // ← FIX: hide delete column for players
                return `
                    <div class="glass-panel rounded-xl overflow-hidden">

            async CrosstableTab(tid) {
                const ct = await API.fideGetCrosstable(tid);
                if (!ct.rows || ct.rows.length === 0) return Components.EmptyState('No data yet', 'Generate rounds and record results first');
                const n = ct.rows.length;
                return `
                    <div class="glass-panel rounded-xl overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="text-xs border-collapse w-full">
                                <thead class="text-[9px] text-gray-500 font-mono uppercase bg-black/20">

                                        <th class="p-2 text-left">Name</th>
                                        <th class="p-2 text-right">Rtg</th>

                                        <th class="p-2 text-right">Pts</th>

                                </thead>
                                <tbody>
                                    ${ct.rows.map(row => `
                                        <tr class="border-b border-white/5 hover:bg-white/5">
                                            <td class="p-2 font-mono text-gray-500">${row.ct_rank}</td>

                                                const cls = val === 'X' ? 'bg-gray-800 text-gray-600' : val.startsWith('1') ? 'text-green-400' : (val.startsWith('0') && !val.startsWith('0.')) ? 'text-red-400' : 'text-gray-300';
                                                return `<td class="p-2 text-center font-mono ${cls}">${val || ''}</td>`;
                                            }).join('')}
                                            <td class="p-2 text-right font-bold text-accent-400">${row.points}</td>
                                        </tr>

                            </table>

            async NormsTab(tid) {
                const norms = await API.fideGetTitleNorms(tid);
                if (norms.length === 0) return Components.EmptyState('No title norms achieved', 'Players need 5+ games and sufficient performance rating');
                return `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        // ─── COMPONENTS ──────────────────────────────────────────────────────────────
        const Components = {
            EmptyState(title, sub = '') {
                return `
                    <div class="glass-panel border-dashed border-gray-700 p-12 rounded-xl flex flex-col items-center justify-center text-center">

                return `
                    <div class="p-8 text-center">
                        <i class="ph-bold ph-warning-circle text-4xl text-red-500 mb-2"></i>

            UnifiedTournamentCard(t) {
                const isFide = t.type === 'fide';
                const badgeColor = isFide ? 'text-amber-400 bg-amber-400/10 border-amber-400/20' : 'text-blue-400 bg-blue-400/10 border-blue-400/20';
                const icon = isFide ? 'ph-crown' : 'ph-trophy';
                const typeLabel = isFide ? 'FIDE Swiss' : 'Standard';
                const clickAction = isFide ? `Router.navigate('fide_detail', '${t.id}')` : `Router.navigate('tournament_detail', '${t.id}')`;
                return `
                    <div onclick="${clickAction}" class="glass-panel p-6 rounded-2xl group interactive cursor-pointer relative overflow-hidden">

            TournamentCard(t) {

            RoundBlock(r, data, idx) {
                const matches = Array.isArray(data) ? data : (data.matches || []);
                const typeLabel = r.round_type.replace(/_/g, ' ').toUpperCase();
                const isPlayer = isPlayerRole();
                const myPlayerId = isPlayer && State.currentUser ? State.currentUser.player_id : null;
                const rows = matches.map((m, i) => Components.MatchRow(m, i + 1, myPlayerId, isPlayer)).join('');

                return `
                    <div class="glass-panel rounded-xl overflow-hidden border-l-4 border-l-accent-500">
                        <div class="px-6 py-4 bg-white/5 border-b border-white/5 flex justify-between items-center">

                        </div>
                        ${matches.length === 0
                            ? '<div class="px-6 py-8 text-center text-gray-600 text-sm">No matches in this round.</div>'
                            : `<table class="w-full border-collapse text-sm">
                                <thead>
                                    <tr class="bg-white/[0.03] border-b border-white/5">
                                        <th class="px-4 py-3 text-left text-[10px] font-mono text-gray-500 uppercase tracking-widest w-12">Bd.</th>
                                        <th class="px-4 py-3 text-left text-[10px] font-mono text-gray-500 uppercase tracking-widest">
                                            <span class="inline-flex items-center gap-1.5">
                                                <span class="w-2.5 h-2.5 rounded-full bg-white border border-gray-600 inline-block"></span>
                                                White
                                            </span>
                                        </th>
                                        <th class="px-4 py-3 text-center text-[10px] font-mono text-gray-500 uppercase tracking-widest w-28">Result</th>
                                        <th class="px-4 py-3 text-left text-[10px] font-mono text-gray-500 uppercase tracking-widest">
                                            <span class="inline-flex items-center gap-1.5">
                                                <span class="w-2.5 h-2.5 rounded-full bg-gray-900 border border-gray-500 inline-block"></span>
                                                Black
                                            </span>
                                        </th>
                                        ${!isPlayer ? '<th class="px-4 py-3 w-24"></th>' : ''}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-white/[0.04]">
                                    ${rows}
                                </tbody>
                              </table>`
                        }
                    </div>`;
            },

            MatchRow(m, fallbackBoard, myPlayerId, isPlayer) {
                const playerNames = m.player_names && m.player_names.length
                    ? m.player_names
                    : (m.players || []).map(p => p.name || p.id);
                const winnerNames = m.winner_names || [];
                const status = m.status || (m.auto_bye ? 'bye' : m.result ? (m.result === 'draw' ? 'draw' : 'completed') : 'pending');

                const isComplete = status === 'completed' || status === 'bye';
                const isDraw     = status === 'draw';
                const isPending  = status === 'pending';
                const boardNo    = m.board_no || fallbackBoard;

                let whiteName = m.white_player;
                let blackName = m.black_player;
                let whiteId   = m.white_id || (m.player_ids && m.player_ids[0]);
                let blackId   = m.black_id || (m.player_ids && m.player_ids[1]);

                if (!whiteName && playerNames.length >= 2) whiteName = playerNames[0];
                if (!blackName && playerNames.length >= 2) blackName = playerNames[1];

                let resultCell  = '';
                let resultClass = 'text-yellow-500 bg-yellow-500/10 border-yellow-500/20';

                if (m.auto_bye || status === 'bye') {
                    resultCell  = '<span class="text-purple-400">½ BYE</span>';
                    resultClass = 'text-purple-400 bg-purple-500/10 border-purple-500/20';
                } else if (isDraw) {
                    resultCell  = '<span class="font-bold">½ – ½</span>';
                    resultClass = 'text-blue-400 bg-blue-500/10 border-blue-500/20';
                } else if (isComplete) {
                    const whiteWon = winnerNames.includes(whiteName);
                    resultCell  = whiteWon
                        ? '<span class="font-bold text-green-400">1</span><span class="text-gray-500 mx-0.5">–</span><span class="font-bold text-gray-500">0</span>'
                        : '<span class="font-bold text-gray-500">0</span><span class="text-gray-500 mx-0.5">–</span><span class="font-bold text-green-400">1</span>';
                    resultClass = 'text-gray-300 bg-white/5 border-white/10';
                } else {
                    resultCell = '<span class="text-[10px] font-mono tracking-widest">vs</span>';
                }

                const myMatch    = myPlayerId && (whiteId === myPlayerId || blackId === myPlayerId);
                const rowBg      = myMatch ? 'bg-accent-500/5 hover:bg-accent-500/10' : 'hover:bg-white/[0.02]';
                const whiteWinner = isComplete && winnerNames.includes(whiteName);
                const blackWinner = isComplete && winnerNames.includes(blackName);
                const whiteClass  = whiteWinner ? 'text-green-400 font-semibold' : (isComplete && !isDraw && !whiteWinner ? 'text-gray-500 line-through' : 'text-gray-200');
                const blackClass  = blackWinner ? 'text-green-400 font-semibold' : (isComplete && !isDraw && !blackWinner ? 'text-gray-500 line-through' : 'text-gray-200');

                // ← FIX: "Enter" button hidden entirely for players
                const reportBtn = (!isPlayer && isPending && !m.auto_bye)
                    ? `<td class="px-4 py-3 text-right">
                           <button onclick='Modals.reportMatch(${JSON.stringify(m).replace(/'/g, "&#39;")})' class="text-[10px] text-accent-400 hover:text-white border border-accent-500/30 hover:bg-accent-500 px-2 py-1 rounded transition-all font-mono uppercase tracking-wide">
                               Enter
                           </button>
                       </td>`
                    : (isPlayer ? '' : '<td></td>');

                return `
                    <tr class="${rowBg} transition-colors ${myMatch ? 'border-l-2 border-l-accent-500' : ''}">
                        <td class="px-4 py-3 font-mono text-gray-600 text-xs text-center">${boardNo}</td>
                        <td class="px-4 py-3">
                            <span class="inline-flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-white border border-gray-600 flex-shrink-0"></span>
                                <span class="${whiteClass} text-sm">${whiteName || '—'}</span>
                                ${whiteWinner ? '<i class="ph-fill ph-crown text-green-400 text-xs"></i>' : ''}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-center">
                            <span class="inline-flex items-center justify-center gap-0.5 text-sm font-bold px-3 py-1 rounded border ${resultClass}">
                                ${resultCell}
                            </span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="inline-flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-gray-900 border border-gray-500 flex-shrink-0"></span>
                                <span class="${blackClass} text-sm">${blackName || '—'}</span>
                                ${blackWinner ? '<i class="ph-fill ph-crown text-green-400 text-xs"></i>' : ''}
                            </span>
                        </td>
                        ${reportBtn}
                    </tr>`;
            }

        // ─── MODALS ──────────────────────────────────────────────────────────────────
        const Modals = {

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                requestAnimationFrame(() => {

                    content.classList.remove('opacity-0', 'scale-95');
                    content.classList.add('scale-100');

            close() {

            async createPlayer() {
                const name         = document.getElementById('inp-pname').value;
                const rating       = parseInt(document.getElementById('inp-prating').value) || 0;
                const federation   = document.getElementById('inp-pfed').value;
                const title        = document.getElementById('inp-ptitle').value;
                const club         = document.getElementById('inp-pclub').value;
                const fide_id      = document.getElementById('inp-pfid').value;
                const date_of_birth = document.getElementById('inp-pdob').value;
                if (!name) return Toast.show('Name required', 'error');
                await API.createPlayer({ name, date_of_birth, rating, federation: federation ? federation.toUpperCase() : '', title, club, fide_id });

                Toast.show('Player registered successfully');
                Router.navigate('players');

            async submitCreateTournament() {
                const name = document.getElementById('new-tournament-name').value;
                const type = document.querySelector('input[name="tournament-type"]:checked').value;
                if (!name) return Toast.show('Please enter a tournament name', 'error');
                try {
                    if (type === 'fide') {
                        const tournament_date = document.getElementById('new-fide-date').value;
                        if (!tournament_date) return Toast.show('Tournament date required', 'error');
                        const cats = document.getElementById('new-fide-cats').value.split(',').map(c => c.trim()).filter(Boolean);
                        await API.fideCreateTournament({
                            name,
                            arbiter:        document.getElementById('new-tournament-arbiter').value,
                            chief_arbiter:  document.getElementById('new-fide-chief-arbiter').value,
                            time_control:   document.getElementById('new-fide-time').value,
                            tournament_date,
                            max_rounds:     parseInt(document.getElementById('new-fide-rounds').value) || 7,
                            venue:          document.getElementById('new-fide-venue').value,
                            categories:     cats.length ? cats : ['Open']
                        });
                        Toast.show('FIDE Tournament created successfully', 'success');
                    } else {
                        await API.createTournament(name);
                        Toast.show('Tournament created successfully', 'success');
                    }
                    Modals.close();
                    Router.navigate('tournaments');
                } catch (e) { Toast.show(e.message, 'error'); }

                if (ids.length === 0) return Toast.show('No selection', 'error');

                Router.navigate('tournament_detail', tId);

                const name         = document.getElementById('inp-quickadd-name').value;
                const rating       = parseInt(document.getElementById('inp-quickadd-rating').value) || 0;
                const federation   = document.getElementById('inp-quickadd-fed').value;

                const fide_id      = document.getElementById('inp-quickadd-fid').value;
                const date_of_birth = document.getElementById('inp-quickadd-dob').value;
                if (!name)          return Toast.show('Name required', 'error');
                if (!date_of_birth) return Toast.show('Date of birth required', 'error');
                const player = await API.createPlayer({ name, date_of_birth, rating, federation: federation ? federation.toUpperCase() : '', title, club, fide_id });
                await API.addPlayers(tId, [player.id]);
                Modals.close();
                Toast.show('Player added to tournament', 'success');
                Router.navigate('tournament_detail', tId);
            },

            async createRound(tId, force = false) {
                const strat = document.getElementById('inp-strat').value;
                const ppm   = document.getElementById('inp-ppm').value;
                try {
                    await API.createRound(tId, strat, parseInt(ppm), force);
                    Modals.close();
                    Router.navigate('tournament_detail', tId);
                    Toast.show('Round generated successfully');
                } catch (e) {
                    if (e.code === 'PENDING_MATCHES') {
                        if (confirm('Previous round has pending matches. Force create new round?'))
                            await Handlers.createRound(tId, true);
                    } else {
                        Toast.show(e.message, 'error');
                    }
                }
            },

            async submitWin(mId, pId) {
                await API.recordResult(mId, { result: 'win', winner_ids: [pId] });
                Modals.close();
                Router.navigate('tournament_detail', State.activeTournament.id);
            },

            async submitDraw(mId) {
                await API.recordResult(mId, { result: 'draw' });
                Modals.close();
                Router.navigate('tournament_detail', State.activeTournament.id);
            },

            async submitFFA(mId, pIds) {
                const rankings = {};
                for (const pid of pIds) {
                    const r = document.getElementById(`rank-${pid}`).value;
                    if (!r) return Toast.show('All ranks required', 'error');
                    rankings[pid] = parseInt(r);
                }
                const winners = Object.entries(rankings).filter(([, rank]) => rank === 1).map(([pid]) => pid);
                await API.recordResult(mId, { result: 'rankings', winner_ids: winners, rankings });
                Modals.close();
                Router.navigate('tournament_detail', State.activeTournament.id);
            },

            async changePassword() {
                const current = document.getElementById('chpwd-current').value;
                const newPwd  = document.getElementById('chpwd-new').value;
                const confirm = document.getElementById('chpwd-confirm').value;
                if (!current || !newPwd || !confirm) return Toast.show('All fields are required', 'error');
                if (newPwd !== confirm)               return Toast.show('New passwords do not match', 'error');
                if (newPwd.length < 8)                return Toast.show('New password must be at least 8 characters', 'error');
                try {
                    await API.changePassword({ current_password: current, new_password: newPwd });
                    Modals.close();
                    Toast.show('Password changed successfully');
                } catch (e) { /* Toast already shown by API.req */ }
            },

            async reloadPlugins() {
                await API.reloadPlugins();
                Toast.show('System plugins reloaded');
            },

            async logout() {
                try { await API.logout(); } catch (e) { /* ignore */ }
                window.location.href = '/login';
            },

            async deletePlayer(playerId, playerName) {
                if (!window.confirm(`Delete ${playerName}?`)) return;
                await API.deletePlayer(playerId);
                Toast.show('Player removed', 'success');
                Router.navigate('players');
            },

            searchPlayers(query) {
                const q = query.toLowerCase();
                document.querySelectorAll('.player-card').forEach(card => {
                    card.style.display = (card.dataset.name.includes(q) || card.dataset.id.includes(q)) ? 'flex' : 'none';
                });
            },

            searchImportPlayers(query) {
                const q = query.toLowerCase();
                document.querySelectorAll('.import-player-item').forEach(item => {
                    const name = item.dataset.name || '';
                    const dob  = item.dataset.dob  || '';
                    item.style.display = (!q || name.includes(q) || dob.includes(q)) ? 'flex' : 'none';
                });
            }
        };

                        <div>
                            <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">Tournament Name</label>
                            <input id="fide-tname" type="text" class="input-dark w-full px-4 py-3 rounded-lg text-sm" placeholder="e.g. City Open 2025">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">Date</label>
                                <input id="fide-tdate" type="date" class="input-dark w-full px-4 py-3 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">Max Rounds</label>
                                <input id="fide-trounds" type="number" value="7" min="1" max="15" class="input-dark w-full px-4 py-3 rounded-lg text-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">Venue</label>
                                <input id="fide-tvenue" type="text" class="input-dark w-full px-4 py-3 rounded-lg text-sm" placeholder="Location">
                            </div>
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">Time Control</label>
                                <select id="fide-ttc" class="input-dark w-full px-4 py-3 rounded-lg text-sm appearance-none">
                                    <option value="Standard" class="bg-gray-900">Standard</option>
                                    <option value="Rapid"    class="bg-gray-900">Rapid</option>
                                    <option value="Blitz"    class="bg-gray-900">Blitz</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">Arbiter</label>
                                <input id="fide-tarbiter" type="text" class="input-dark w-full px-4 py-3 rounded-lg text-sm" placeholder="Chief Arbiter name">
                            </div>
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">Chief Arbiter</label>
                                <input id="fide-tchief" type="text" class="input-dark w-full px-4 py-3 rounded-lg text-sm" placeholder="Optional">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">Categories (comma-separated)</label>
                            <input id="fide-tcats" type="text" class="input-dark w-full px-4 py-3 rounded-lg text-sm" value="Open" placeholder="e.g. U11,U13,U15,Open">
                        </div>
                        <div class="flex justify-end gap-3 pt-4">
                            <button onclick="Modals.close()" class="btn-ghost px-4 py-2 rounded-lg text-sm">Cancel</button>
                            <button onclick="FideHandlers.submitFideTournament()" class="btn-neon px-6 py-2 rounded-lg text-sm font-medium">Create</button>
                        </div>
                    </div>`);
            },

            registerPlayer(tid) {
                Modals.open('Register Player', `
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">Full Name</label>
                                <input id="fp-name" type="text" class="input-dark w-full px-4 py-3 rounded-lg text-sm" placeholder="Kasparov, Garry">
                            </div>
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">FIDE Rating</label>
                                <input id="fp-rating" type="number" value="0" class="input-dark w-full px-4 py-3 rounded-lg text-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">DOB</label>
                                <input id="fp-dob" type="date" class="input-dark w-full px-4 py-3 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">Federation</label>
                                <input id="fp-fed" type="text" class="input-dark w-full px-4 py-3 rounded-lg text-sm" placeholder="RUS" maxlength="3">
                            </div>
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">Title</label>
                                <select id="fp-title" class="input-dark w-full px-4 py-3 rounded-lg text-sm appearance-none">
                                    <option value="" class="bg-gray-900">None</option>
                                    <option value="GM"  class="bg-gray-900">GM</option>
                                    <option value="IM"  class="bg-gray-900">IM</option>
                                    <option value="FM"  class="bg-gray-900">FM</option>
                                    <option value="CM"  class="bg-gray-900">CM</option>
                                    <option value="WGM" class="bg-gray-900">WGM</option>
                                    <option value="WIM" class="bg-gray-900">WIM</option>
                                    <option value="WFM" class="bg-gray-900">WFM</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">Club</label>
                                <input id="fp-club" type="text" class="input-dark w-full px-4 py-3 rounded-lg text-sm" placeholder="Club Name">
                            </div>
                            <div>
                                <label class="block text-xs font-mono text-gray-500 mb-1.5 uppercase">FIDE ID</label>
                                <input id="fp-fid" type="text" class="input-dark w-full px-4 py-3 rounded-lg text-sm" placeholder="Optional">
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 pt-4">
                            <button onclick="Modals.close()" class="btn-ghost px-4 py-2 rounded-lg text-sm">Cancel</button>
                            <button onclick="FideHandlers.submitFidePlayer('${tid}')" class="btn-neon px-6 py-2 rounded-lg text-sm font-medium">Register</button>
                        </div>
                    </div>`);
            },

            recordResult(tid, roundN, pairing) {
                Modals.open('Record Result', `
                    <p class="text-center text-gray-400 text-xs mb-2 font-mono">BOARD ${pairing.board} • ROUND ${roundN}</p>
                    <div class="grid grid-cols-3 gap-4 my-6">
                        <button onclick="FideHandlers.submitFideResult('${pairing.match_id}','1-0','${tid}')" class="group p-5 rounded-xl border border-white/10 bg-gradient-to-br from-white/10 to-transparent hover:from-white/20 transition-all text-center">
                            <span class="w-6 h-6 rounded bg-white border border-gray-300 inline-block mb-2"></span>
                            <span class="block font-bold text-white text-sm group-hover:scale-105 transition-transform">${pairing.white_name}</span>
                            <span class="text-[10px] text-green-400 mt-1">1 - 0</span>
                        </button>
                        <button onclick="FideHandlers.submitFideResult('${pairing.match_id}','0.5-0.5','${tid}')" class="group p-5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all text-center flex flex-col justify-center items-center">
                            <i class="ph-bold ph-scales text-2xl text-gray-400 mb-2 group-hover:text-white"></i>
                            <span class="text-[10px] text-gray-500">½ - ½</span>
                        </button>
                        <button onclick="FideHandlers.submitFideResult('${pairing.match_id}','0-1','${tid}')" class="group p-5 rounded-xl border border-white/10 bg-gradient-to-br from-gray-800/50 to-transparent hover:from-gray-700/50 transition-all text-center">
                            <span class="w-6 h-6 rounded bg-gray-800 border border-gray-600 inline-block mb-2"></span>
                            <span class="block font-bold text-white text-sm group-hover:scale-105 transition-transform">${pairing.black_name}</span>
                            <span class="text-[10px] text-green-400 mt-1">0 - 1</span>
                        </button>
                    </div>`);
            },

            async playerCard(tid, pid) {
                try {
                    const card = await API.fideGetPlayerCard(tid, pid);
                    Modals.open('Player Card', `
                        <div class="space-y-4">
                            <div class="flex items-center gap-4 mb-4">
                                <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-amber-500/20 to-amber-700/10 border border-amber-500/30 flex items-center justify-center font-display font-bold text-2xl text-amber-400">
                                    ${(card.name || '?').substring(0, 2).toUpperCase()}
                                </div>
                                <div>
                                    <h3 class="font-display font-bold text-xl text-white">${card.title ? `<span class="text-amber-400 mr-1">${card.title}</span>` : ''}${card.name}</h3>
                                    <p class="text-xs text-gray-500 font-mono">${card.federation || ''} • Rating: ${card.rating} • ${card.category}</p>
                                </div>
                            </div>
                            <div class="glass-panel rounded-lg overflow-hidden">
                                <table class="w-full text-xs">
                                    <thead class="bg-black/20 text-gray-500 font-mono uppercase">
                                        <tr>
                                            <th class="p-2">Rd</th>
                                            <th class="p-2">Color</th>
                                            <th class="p-2">Opponent</th>
                                            <th class="p-2 text-right">Rtg</th>
                                            <th class="p-2 text-center">Result</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${(card.rounds || []).map(r => `
                                            <tr class="border-b border-white/5 hover:bg-white/5">
                                                <td class="p-2 font-mono">${r.round}</td>
                                                <td class="p-2">${r.color === 'W' ? '⬜' : '⬛'}</td>
                                                <td class="p-2 text-white">${r.opponent_name || 'BYE'}</td>
                                                <td class="p-2 text-right font-mono text-gray-400">${r.opponent_rating || '-'}</td>
                                                <td class="p-2 text-center font-bold ${r.result === '1' ? 'text-green-400' : r.result === '0' ? 'text-red-400' : 'text-gray-300'}">
                                                    ${r.result === '1' ? '1' : r.result === '0' ? '0' : r.result === '0.5' ? '½' : '*'}
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                            <div class="flex justify-between text-xs text-gray-500 px-1">
                                <span>Points: <strong class="text-accent-400">${card.total_points}</strong></span>
                                <span>Performance: <strong class="text-amber-400">${card.performance_rating || '—'}</strong></span>
                            </div>
                        </div>`);
                } catch (e) { Toast.show('Could not load player card', 'error'); }
            }
        };

        // ─── FIDE HANDLERS ───────────────────────────────────────────────────────────
        const FideHandlers = {
            async submitFideTournament() {
                const name = document.getElementById('fide-tname').value;
                if (!name) return Toast.show('Name required', 'error');
                const cats = document.getElementById('fide-tcats').value.split(',').map(c => c.trim()).filter(Boolean);
                const t = await API.fideCreateTournament({
                    name,
                    tournament_date: document.getElementById('fide-tdate').value,
                    max_rounds:      parseInt(document.getElementById('fide-trounds').value) || 7,
                    venue:           document.getElementById('fide-tvenue').value,
                    arbiter:         document.getElementById('fide-tarbiter').value,
                    chief_arbiter:   document.getElementById('fide-tchief').value,
                    time_control:    document.getElementById('fide-ttc').value,
                    categories:      cats.length ? cats : ['Open'],
                });
                Modals.close();
                Toast.show('FIDE tournament created');
                Router.navigate('fide_detail', t.id);
            },

            async submitFidePlayer(tid) {
                const name = document.getElementById('fp-name').value;
                if (!name) return Toast.show('Name required', 'error');
                await API.fideRegisterPlayer(tid, {
                    name,
                    rating:     parseInt(document.getElementById('fp-rating').value) || 0,
                    dob:        document.getElementById('fp-dob').value,
                    federation: document.getElementById('fp-fed').value.toUpperCase(),
                    title:      document.getElementById('fp-title').value,
                    club:       document.getElementById('fp-club').value,
                    fide_id:    document.getElementById('fp-fid').value,
                });
                Modals.close();
                Toast.show('Player registered');
                Router.navigate('fide_detail', tid);
            },

            async createRound(tid, force = false) {
                try {
                    await API.fideCreateRound(tid, force);
                    Toast.show('Round generated');
                    State.fideTab = 'pairings';
                    Modals.close();
                    Router.navigate('fide_detail', tid);
                } catch (e) {
                    if (e.code === 'PENDING_MATCHES') {
                        if (confirm('Previous round has pending matches. Force create new round?'))
                            await FideHandlers.createRound(tid, true);
                    } else {
                        Toast.show(e.message, 'error');
                    }
                }
            },

            async removePlayer(tid, pid) {
                await API.fideRemovePlayer(tid, pid);
                Toast.show('Player removed');
                Router.navigate('fide_detail', tid);
            },

            async submitFideResult(mid, result, tid) {
                await API.fideRecordResult(mid, result);
                Modals.close();
                Toast.show('Result recorded');
                Router.navigate('fide_detail', tid);
            },
        };

        // ─── UTILS ───────────────────────────────────────────────────────────────────
        const Toast = {
            show(msg, type = 'success') {
                const el = document.createElement('div');
                const color = type === 'success' ? 'border-accent-500 text-accent-400' : 'border-red-500 text-red-400';
                el.className = `glass-panel px-6 py-4 rounded-xl border-l-4 ${color} flex items-center shadow-2xl transform translate-x-full transition-transform duration-300`;
                el.innerHTML = `<span class="font-medium text-sm">${msg}</span>`;
                document.getElementById('toast-container').appendChild(el);
                requestAnimationFrame(() => el.classList.remove('translate-x-full'));
                setTimeout(() => {
                    el.classList.add('translate-x-full');
                    setTimeout(() => el.remove(), 300);
                }, 3000);
            }
        };

        const Loader = {
            start() {
                const l = document.getElementById('global-loader');
                l.classList.remove('hidden');
                requestAnimationFrame(() => l.classList.remove('opacity-0'));
            },
            stop() {
                const l = document.getElementById('global-loader');
                l.classList.add('opacity-0');
                setTimeout(() => l.classList.add('hidden'), 300);
            }
        };

        // ─── INIT ────────────────────────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const me = await API.req('/api/auth/me');
                State.currentUser = me;

                const sidebarUser = document.getElementById('sidebar-username');
                const sidebarRole = document.getElementById('sidebar-role');
                if (sidebarUser) sidebarUser.textContent = me.username || me.name || 'User';
                if (sidebarRole) sidebarRole.textContent = me.role.toUpperCase();

                if (me.role === 'player') {
                    document.getElementById('nav-dashboard').style.display = 'none';
                    document.getElementById('nav-players').style.display   = 'none';
                    const sysLabel  = document.getElementById('nav-system-label');
                    const reloadBtn = document.getElementById('nav-reload-plugins');
                    if (sysLabel)  sysLabel.style.display  = 'none';
                    if (reloadBtn) reloadBtn.style.display = 'none';
                    Router.navigate('player_dashboard');
                } else if (me.role === 'admin') {
                    Router.navigate('admin_dashboard');
                } else {
                    Router.navigate('dashboard');
                }
            } catch (e) {
                window.location.href = '/login';
            }
        });
    </script>
</body>

</html>
